name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 22.16.0

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck every workspace
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Chrome for browser-backed QA
        run: >-
          node --experimental-strip-types --no-warnings -e
          "import('./apps/daemon/src/capture-cover.ts').then(({ findChrome }) => {
          const executable = findChrome();
          if (!executable) throw new Error('Chrome is required for browser-backed QA');
          console.log(executable);
          })"
      - name: Test with coverage and process-leak guard
        env:
          DEZIN_SHARINGAN_HEADLESS: "1"
        run: node scripts/check-process-leaks.mjs -- pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and enforce bundle budgets
        run: pnpm build:check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  desktop-macos:
    # The product is desktop-first on macOS; run the shell and extension suites there.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Desktop shell suite
        run: pnpm --filter dezin-desktop test
      - name: Extension suite
        run: pnpm --filter dezin-extension test
      - name: Electron binary smoke
        run: pnpm --filter dezin-desktop exec electron --version
